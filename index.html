<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JSP - Surveillance</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- START SCREEN -->
    <div id="startScreen" class="screen active">

        <div class="start-content">

            <div class="logo">
                JSP
            </div>

            <div class="subtitle">
                JAPAN STIGMATIZED PROPERTY
            </div>

            <div class="warning">
                SURVEILLANCE SYSTEM
            </div>

            <button id="startButton">
                START
            </button>

        </div>

    </div>


    <!-- GAME SCREEN -->
    <div id="gameScreen" class="screen">

        <!-- HEADER -->
        <header>

            <div class="header-left">
                <span class="rec">● REC</span>
                <span id="cameraName">CAM 01</span>
            </div>

            <div class="game-time" id="gameTime">
                00:00
            </div>

            <div class="header-right">
                FALSE REPORTS
                <span id="falseReports">0/5</span>
            </div>

        </header>


        <!-- CAMERA -->
        <main>

            <div id="cameraContainer">

                <!-- 通常監視画像 -->
                <img
                    id="cameraImage"
                    src="images/normal/cam1.jpg"
                    alt="Surveillance Camera"
                >

                <!-- 危険異変動画 -->
                <video
                    id="dangerVideo"
                    playsinline
                    preload="auto"
                ></video>


                <!-- 画面上の情報 -->
                <div class="camera-overlay">

                    <div class="camera-label">
                        CAMERA <span id="cameraNumber">01</span>
                    </div>

                    <div
                        id="nightIndicator"
                        class="night-indicator"
                    >
                        NIGHT VISION
                    </div>

                </div>


                <!-- スキャンライン -->
                <div class="scanlines"></div>

            </div>


            <!-- STATUS -->
            <div id="status">
                監視を開始してください
            </div>


            <!-- CONTROLS -->
            <div class="controls">

                <button id="prevCamera">
                    ← A
                </button>

                <button
                    id="reportButton"
                    class="report-button"
                >
                    REPORT
                </button>

                <button id="nextCamera">
                    D →
                </button>

            </div>


            <div class="help">
                A / ←　前のカメラ　　D / →　次のカメラ　　W　ナイトビジョン
            </div>

        </main>

    </div>


    <!-- REPORT SCREEN -->
    <div id="reportScreen">

        <div class="report-message">
            異変を報告しています
        </div>

    </div>


    <!-- GAME OVER -->
    <div id="gameOverScreen" class="screen">

        <div class="result-content">

            <div class="result-title">
                GAME OVER
            </div>

            <div class="result-subtitle">
                SURVEILLANCE FAILED
            </div>

            <button id="retryButton">
                RETRY
            </button>

        </div>

    </div>


    <!-- CLEAR -->
    <div id="clearScreen" class="screen">

        <div class="result-content">

            <div class="result-title">
                05:00
            </div>

            <div class="result-subtitle">
                SURVEILLANCE COMPLETE
            </div>

            <button id="clearButton">
                CLEAR
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
